/* Full cover rests against the top rim; the far edge recedes into the crate. */

@media(min-width:768px){#rr-crate-preview[data-cover-open="true"] .rr-scene-crop{padding-bottom:56.25%}#rr-crate-preview .rr-cover-view{perspective:1800px;perspective-origin:50% 32%}#rr-crate-preview .rr-held-record{top:auto;bottom:10%;left:21%;width:58%}}

/* Align the held sleeve with the lower edge of the scene. */

#rr-crate-preview .rr-held-record{animation:none;will-change:transform}
#rr-crate-preview .rr-scene-crop{transition:padding-bottom 1.15s cubic-bezier(.25,.55,.25,1)}

/* Stable viewport and one coordinate system throughout the cover handoff. */
#rr-crate-preview .rr-scene-crop,#rr-crate-preview[data-cover-open="true"] .rr-scene-crop{padding-bottom:56.25%;transition:none}
#rr-crate-preview[data-cover-open="true"] .rr-scene{top:0;margin-top:0}

<script>
(()=>{

let audioStarted=false,audioError='',audioIndex=0;

});

function render(){

async function recoverAudioFailure(){

}
async function selectRecord(i){

async function faceFrontBeforeReturn(){

  }}finally{if(turn)turn.cancel();}

async function moveCover(open,after){

async function returnPlaying(){
  if(listening<0)return;
  coverMoving=true;syncCoverVideo();
  const b=buttons[listening],s=shadows[listening],cs=getComputedStyle(b);
  const x=b.offsetLeft,y=b.offsetTop,w=b.offsetWidth,m=cs.transform;
  const controls=[viewCover,flip,back,prev,next,listen,picker,stop];
  const old=[b.style.transition,s.style.transition,b.style.transformOrigin,s.style.transformOrigin,b.style.zIndex];
  b.style.transition=s.style.transition='none';
  listening=renderedListening=-1;render();controls.forEach(c=>c.disabled=true);

  const end=new DOMMatrix().translate(o,0).multiply(new DOMMatrix(getComputedStyle(b).transform)).translate(-o,0);

async function listenFromStack(park){
  if(coverMoving)return;
  coverMoving=true;syncCoverVideo();
  const card=buttons[selected],shade=shadows[selected];
  const controls=[viewCover,flip,back,prev,next,listen,picker,stop];
  controls.forEach(c=>c.disabled=true);
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const x=parent.left+card.offsetLeft,y=parent.top+card.offsetTop;

    const dest=card.parentElement.getBoundingClientRect();
    const start=new DOMMatrix().translate(x-dest.left-card.offsetLeft,y-dest.top-card.offsetTop-lift)

async function listenFromCover(park){
  if(coverMoving)return;
  coverMoving=true;syncCoverVideo();
  const card=buttons[selected],shade=shadows[selected],host=coverView.getBoundingClientRect();
  const controls=[viewCover,flip,back,prev,next,listen,picker,stop];
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const previousListening=listening;
  const w=held.offsetWidth,h=held.offsetHeight;
  const hx=host.left+held.offsetLeft,hy=host.top+held.offsetTop;
  const stackTop=Math.min(...buttons.filter(b=>b!==card).map(b=>b.getBoundingClientRect().top));
  const lift=Math.max(18,host.bottom-stackTop+12);
  const raised='translateY('+(-lift)+'px) perspective(1100px) rotateX(0deg) rotateZ(-1.2deg)';

    if(!reduced&&held.animate){

viewCover.addEventListener('click',()=>moveCover(!coverOpen));
listen.addEventListener('click',async()=>{
  if(coverMoving||!audioTracks[selected]||selected===listening)return;
  coverMoving=true;startingAudio=true;const coverFadeOut=syncCoverVideo();audioError='';
  if(audioIndex!==selected){audioIndex=selected;audio.src=audioTracks[selected].src;audio.currentTime=0;}

    flipped=false;render();

stop.addEventListener('click',async()=>{if(coverMoving)return;stopAudio();await returnPlaying();save();});

function browseTarget(direction){
  const index=selected>=0?selected:browseIndex;
  let candidate=index;

    candidate=direction>0?(candidate+1)%buttons.length:(candidate<0?buttons.length:candidate)-1;

    if(candidate!==listening)return candidate;
  }

async function browse(direction){
  if(coverMoving)return;
  const target=browseTarget(direction);
  if(target<0)return;
  if(coverOpen)await moveCover(false);
  choose(target);
}
prev.addEventListener('click',()=>browse(-1));
next.addEventListener('click',()=>browse(1));

// Desktop gestures use the same selection, cover and return state as the buttons.
const mouseScene=root.querySelector('.rr-scene-crop');
let wheelSum=0,lastWheelAt=0,lastWheelStep=-Infinity;
mouseScene.addEventListener('wheel',e=>{
  if(e.ctrlKey||e.metaKey||!window.matchMedia('(hover: hover) and (pointer: fine)').matches)return;
  if(coverOpen||coverMoving)return;
  const delta=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;

held.addEventListener('click',e=>{e.stopPropagation();if(coverOpen&&!coverMoving)toggleFlip();});
root.addEventListener('click',e=>{

  if(!coverMoving)moveCover(false);

function restore(s){
  if(coverMoving)return;
  const p=s?.privateContent;
  if([3,4,5].includes(p?.version)&&Number.isInteger(p.selected)&&p.selected>=-1&&p.selected<16){
    selected=p.selected;flipped=!!p.flipped;
    listening=Number.isInteger(p.listening)&&p.listening>=0&&p.listening<16?p.listening:-1;
    browseIndex=Number.isInteger(p.browseIndex)&&p.browseIndex>=-1&&p.browseIndex<16?p.browseIndex:(selected>=0?selected:listening);

restore(window.openai?.widgetState);syncAudio();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState)});
})();
