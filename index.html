    const lift=Math.max(24,card.getBoundingClientRect().bottom-stackTop+gap+width*.08);
    const raised='translateY('+(-lift)+'px) '+pose;
    const timing={duration:1100,easing:'cubic-bezier(.25,.55,.25,1)',fill:'both'};
    flight=sceneAnimate(card,[{transform:pose},{transform:raised}],timing);
    const shadowPose=getComputedStyle(shade).transform;
    shadowLift=sceneAnimate(shade,[{transform:shadowPose},{transform:'translateY('+(-lift)+'px) '+shadowPose}],timing);
    flight.startTime=shadowLift.startTime=document.timeline.currentTime;
    await Promise.all([flight.finished,shadowLift.finished]);
    // Change depth only after clearing the stack; preserve the lifted world pose.
    card.style.animation=shade.style.animation='none';park();controls.forEach(c=>c.disabled=true);
    flight.cancel();shadowLift.cancel();
    const dest=card.parentElement.getBoundingClientRect();
    const start=new DOMMatrix().translate(x-dest.left-card.offsetLeft,y-dest.top-card.offsetTop-lift)
      .translate(origin[0],origin[1]).multiply(new DOMMatrix(pose)).translate(-origin[0],-origin[1]).scale(width/card.offsetWidth);
    const settle={duration:1300,easing:'cubic-bezier(.25,.55,.25,1)',fill:'both'};
    // Rotate and move to the rear only while fully above the stack, then descend vertically.
    const endPose=getComputedStyle(card).transform;
    const rearLift=Math.max(24,card.getBoundingClientRect().bottom-stackTop+gap+width*.08);
    const aboveRear='translateY('+(-rearLift)+'px) '+endPose;
    const landingFrames=[{transform:start.toString(),offset:0},{transform:aboveRear,offset:.45},{transform:endPose,offset:1}];
    landing=sceneAnimate(card,landingFrames,settle);
    shadowLanding=sceneAnimate(shade,landingFrames,settle);
    landing.startTime=shadowLanding.startTime=document.timeline.currentTime;
    await Promise.all([landing.finished,shadowLanding.finished]);
  }finally{
    for(const motion of [flight,shadowLift,landing,shadowLanding])if(motion)motion.cancel();
    coverMoving=false;controls.forEach(c=>c.disabled=false);render();save();
  }
}
async function listenFromCover(park){
  if(coverMoving)return;
  coverMoving=true;syncCoverVideo();
  const card=buttons[selected],shade=shadows[selected],host=coverView.getBoundingClientRect();
  const controls=[viewCover,flip,back,prev,next,listen,picker,stop];
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let flight,landing,shadowFlight;
  const previousListening=listening;
  const w=held.offsetWidth,h=held.offsetHeight;
  const hx=host.left+held.offsetLeft,hy=host.top+held.offsetTop;
  const stackTop=Math.min(...buttons.filter(b=>b!==card).map(b=>b.getBoundingClientRect().top));
  const lift=Math.max(18,host.bottom-stackTop+12);
  const raised='translateY('+(-lift)+'px) perspective(1100px) rotateX(0deg) rotateZ(-1.2deg)';
  controls.forEach(c=>c.disabled=true);
  try{
    if(!reduced&&held.animate){
      flight=sceneAnimate(held,[{transform:getComputedStyle(held).transform},{transform:raised}],{duration:900,easing:'cubic-bezier(.25,.55,.25,1)',fill:'both'});
      await flight.finished;
    }
    // Commit listening state with its canned drop disabled, then glide the real
    // sleeve behind the stack so the crate and other sleeves occlude it correctly.
    card.style.animation='none';shade.style.animation='none';
    park();controls.forEach(c=>c.disabled=true);
    if(!reduced&&card.animate){
      const parent=card.parentElement.getBoundingClientRect();
      const cx=parent.left+card.offsetLeft,cy=parent.top+card.offsetTop;
      const ratio=w/card.offsetWidth;
      const start=new DOMMatrix().translate(hx-cx+w/2,hy-cy+h-lift).rotate(0,0,-1.2).translate(-w/2,-h).scale(ratio);
      const end=getComputedStyle(card).transform;
      const timing={duration:1300,delay:previousListening>=0?1200:0,easing:'cubic-bezier(.25,.55,.25,1)',fill:'both'};
      landing=sceneAnimate(card,[{transform:start.toString()},{transform:end}],timing);
      shadowFlight=sceneAnimate(shade,[{transform:start.toString(),opacity:.4},{transform:getComputedStyle(shade).transform,opacity:1}],timing);
      const clock=document.timeline.currentTime;landing.startTime=clock;shadowFlight.startTime=clock;
      await Promise.all([landing.finished,shadowFlight.finished]);
    }
  }catch(e){if(coverOpen)park();}
  if(flight)flight.cancel();if(landing)landing.cancel();if(shadowFlight)shadowFlight.cancel();
  coverMoving=false;controls.forEach(c=>c.disabled=false);render();save();
}
viewCover.addEventListener('click',()=>moveCover(!coverOpen));
listen.addEventListener('click',()=>playRecord(selected));
async function playRecord(target){
  if(coverMoving||!audioTracks[target])return;
  if(target===listening&&audioStarted){pauseAudio.click();return;}
  coverMoving=true;startingAudio=true;const coverFadeOut=syncCoverVideo();audioError='';
  if(audioIndex!==target){audioIndex=target;audio.src=audioTracks[target].src;audio.currentTime=0;}
  syncPlayer();
  try{await audio.play();audioStarted=true;syncAudio();await coverFadeOut;startingAudio=false;}
  catch(e){startingAudio=false;audioError='Playback could not start. Press Play to try again.';coverMoving=false;await recoverAudioFailure();return;}
  coverMoving=false;
  if(target===listening){render();return;}
  // One sleeve moves at a time: tuck the open cover, return the old record,
  // then lift and park the new record through a clear overhead path.
  if(coverOpen)await moveCover(false);
  if(listening>=0)await returnPlaying();
  await settleSleeveSelection(target);
  const park=()=>{listening=target;browseIndex=target;selected=-1;flipped=false;coverOpen=false;render();save();};
  await listenFromStack(park);
}
stop.addEventListener('click',async()=>{if(coverMoving)return;stopAudio();await returnPlaying();save();});
picker.addEventListener('change',()=>selectRecord(Number(picker.value)));flip.addEventListener('click',toggleFlip);back.addEventListener('click',()=>{if(coverOpen)moveCover(false);else choose(-1);});
function browseTarget(direction){
  const index=selected>=0?selected:browseIndex;
  let candidate=index;
  for(let step=0;step<buttons.length;step++){
    candidate=direction>0?(candidate+1)%buttons.length:(candidate<0?buttons.length:candidate)-1;
    if(candidate<0)return -1;
    if(candidate!==listening)return candidate;
  }
  return -1;
}
async function browse(direction){
  if(coverMoving)return;
  const target=browseTarget(direction);
  if(target<0)return;
  if(coverOpen)await moveCover(false);
  choose(target);
}
prev.addEventListener('click',()=>browse(-1));
next.addEventListener('click',()=>browse(1));

// Desktop gestures use the same selection, cover and return state as the buttons.
const mouseScene=root.querySelector('.rr-scene-crop');
let wheelSum=0,lastWheelAt=0,lastWheelStep=-Infinity;
mouseScene.addEventListener('wheel',e=>{
  if(e.ctrlKey||e.metaKey||!window.matchMedia('(hover: hover) and (pointer: fine)').matches)return;
  if(coverOpen||coverMoving)return;
  const delta=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;
  if(!delta)return;
  const index=selected>=0?selected:browseIndex;
  if(delta<0&&browseTarget(-1)<0)return;
  e.preventDefault();
  const now=performance.now();
  if(now-lastWheelAt>180||Math.sign(delta)!==Math.sign(wheelSum))wheelSum=0;
  lastWheelAt=now;
  if(now-lastWheelStep<700){wheelSum=0;return;}
  wheelSum+=delta*(e.deltaMode===1?16:e.deltaMode===2?mouseScene.clientHeight:1);
  if(Math.abs(wheelSum)<32)return;
  const direction=Math.sign(wheelSum);wheelSum=0;lastWheelStep=now;
  browse(direction);
},{passive:false});

// One horizontal touch gesture browses one sleeve. Vertical gestures remain page scrolling.
let sleeveSwipe=null,suppressSwipeClickUntil=0;
mouseScene.addEventListener('pointerdown',event=>{
  if(event.pointerType!=='touch')return;
  if(sleeveSwipe||!event.isPrimary){sleeveSwipe=null;return;}
  if(coverMoving||!event.target.closest('.rr-records .rr-record,.rr-held-record'))return;
  sleeveSwipe={id:event.pointerId,x:event.clientX,y:event.clientY,started:performance.now(),axis:null};
});
window.addEventListener('pointerdown',event=>{
  if(sleeveSwipe&&event.pointerId!==sleeveSwipe.id)sleeveSwipe=null;
});
mouseScene.addEventListener('pointermove',event=>{
  if(!sleeveSwipe||event.pointerId!==sleeveSwipe.id)return;
  const dx=event.clientX-sleeveSwipe.x,dy=event.clientY-sleeveSwipe.y;
  if(!sleeveSwipe.axis&&Math.max(Math.abs(dx),Math.abs(dy))>10){
    sleeveSwipe.axis=Math.abs(dx)>Math.abs(dy)*1.3?'horizontal':'vertical';
  }
});
mouseScene.addEventListener('pointerup',event=>{
  if(!sleeveSwipe||event.pointerId!==sleeveSwipe.id)return;
  const gesture=sleeveSwipe;sleeveSwipe=null;
  const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;
  if(gesture.axis==='vertical')return;
  if(Math.abs(dx)<36||Math.abs(dx)<Math.abs(dy)*1.3)return;
  // Suppress the compatibility click so a swipe never also opens or flips a cover.
  clearSleeveTap();suppressSwipeClickUntil=performance.now()+600;
  if(performance.now()-gesture.started>1200||coverMoving)return;
  browse(dx<0?1:-1);
});
window.addEventListener('pointercancel',()=>{sleeveSwipe=null;clearSleeveTap();});
window.addEventListener('blur',()=>{sleeveSwipe=null;clearSleeveTap();});
root.addEventListener('click',event=>{
  if(event.detail!==0&&performance.now()<suppressSwipeClickUntil&&mouseScene.contains(event.target)){
    event.preventDefault();event.stopImmediatePropagation();
  }
},true);

held.addEventListener('click',e=>{e.stopPropagation();if(coverOpen)tapSleeve(e,selected,()=>toggleFlip());});
root.addEventListener('click',e=>{
  if(!coverOpen||held.contains(e.target))return;
  if(e.target.closest('button,select,input,a,label,summary')&&!e.target.closest('.rr-record'))return;
  e.preventDefault();e.stopPropagation();
  if(!coverMoving)moveCover(false);
},true);

// One player and one audio element for both the playlist and the physical crate.
const playerRoom=document.createElement('section');playerRoom.className='rr-listening-room';playerRoom.setAttribute('aria-label','Remix collection audio player');
playerRoom.innerHTML=`<div class="rr-room-top"><strong><i class="rr-room-light"></i>RHYTHM RESEARCH</strong><span>THE LISTENING ROOM</span></div><div class="rr-room-grid"><div class="rr-deck"><div class="rr-artwork-frame"><img class="rr-player-art" alt=""></div><div class="rr-deck-copy"><div class="rr-deck-kicker">READY WHEN YOU ARE</div><h2 class="rr-deck-title"></h2><p class="rr-deck-artist"></p></div><div class="rr-deck-controls"><button type="button" class="rr-track-prev" aria-label="Previous track"></button><button type="button" class="rr-rewind" aria-label="Skip back 10 seconds"></button><button type="button" class="rr-deck-play" aria-label="Play track"></button><button type="button" class="rr-forward" aria-label="Skip forward 10 seconds"></button><button type="button" class="rr-track-next" aria-label="Next track"></button></div><p class="rr-deck-status" role="status"></p></div><div class="rr-playlist-panel"><div class="rr-playlist-header"><h3>The Remix Collection</h3><span>12 tracks</span></div><ol class="rr-playlist" aria-label="Remix playlist"></ol></div></div>`;
root.querySelector('.rr-console-content').prepend(playerRoom);
const deck=playerRoom.querySelector('.rr-deck'),deckPlay=playerRoom.querySelector('.rr-deck-play');
deck.insertBefore(root.querySelector('.rr-transport'),playerRoom.querySelector('.rr-deck-controls'));
const digTools=document.createElement('section');digTools.className='rr-dig-tools';digTools.setAttribute('aria-label','Crate controls');digTools.innerHTML='<div class="rr-strip-heading">CRATE CONTROLS</div>';digTools.append(root.querySelector('.rr-player'));stop.textContent='Return playing record to crate';digTools.querySelector('.rr-actions').append(stop);deck.append(digTools);
const roomIcon=name=>'<span class="rr-control-icon" aria-hidden="true" style="--rr-control-icon:url(remix-assets/control-icons/'+name+'.svg)"></span>';
const playIcon=roomIcon('play'),pauseIcon=roomIcon('pause');
playerRoom.querySelector('.rr-track-prev').innerHTML=roomIcon('skip-back');
playerRoom.querySelector('.rr-track-next').innerHTML=roomIcon('skip-forward');
playerRoom.querySelector('.rr-rewind').innerHTML=roomIcon('undo')+'<span class="rr-skip-label" aria-hidden="true">10</span>';
playerRoom.querySelector('.rr-forward').innerHTML=roomIcon('redo')+'<span class="rr-skip-label" aria-hidden="true">10</span>';
function syncCrateIcons(){
 const controls=[[prev,'chevron-left','Previous sleeve'],[next,'chevron-right','Next sleeve'],[viewCover,coverOpen?'download':'expand',coverOpen?'Return cover':'View cover'],[listen,'headphones',selected>=0&&!audioTracks[selected]?'Coming soon':'Listen'],[flip,'flip-horizontal',flipped?'View front':'View back'],[back,'download','Return sleeve'],[stop,'stop','Return playing record to crate']];
 for(const [button,icon,label] of controls){
  button.setAttribute('aria-label',label);button.title=label;
  const markup=roomIcon(icon)+'<span>'+label+'</span>';
  if(button.innerHTML!==markup)button.innerHTML=markup;
 }
}
const trackIds=Object.keys(audioTracks).map(Number),playlistButtons=[];
function trackParts(i){const parts=names[i].split(' — ');return {artist:parts[0],title:parts.slice(1).join(' — ')||names[i]};}
trackIds.forEach(i=>{
 const item=document.createElement('li'),button=document.createElement('button'),parts=trackParts(i);
 button.type='button';button.className='rr-playlist-item';button.dataset.track=i;button.setAttribute('aria-label','Play '+names[i]);
 const image=buttons[i].querySelector('.rr-front img');
 button.innerHTML='<span class="rr-song-number"></span><img alt="" loading="lazy"><span class="rr-song-info"><strong></strong><small></small></span><span class="rr-song-duration"></span>';
 button.querySelector('img').src=image.src;button.querySelector('strong').textContent=parts.title;button.querySelector('small').textContent=parts.artist;button.querySelector('.rr-song-duration').textContent=stamp(audioTracks[i].duration);
 button.addEventListener('click',()=>playRecord(i));item.append(button);playerRoom.querySelector('.rr-playlist').append(item);playlistButtons.push(button);
});
function playerIndex(){return audioStarted?audioIndex:listening>=0&&audioTracks[listening]?listening:audioTracks[selected]?selected:0;}

// Reuse the sleeve's silent loop in the listening-room artwork.
const playerVideo=document.createElement('video');
playerVideo.className='rr-player-video';playerVideo.muted=true;playerVideo.defaultMuted=true;
playerVideo.loop=true;playerVideo.playsInline=true;playerVideo.preload='none';
playerVideo.setAttribute('muted','');playerVideo.setAttribute('playsinline','');playerVideo.setAttribute('aria-hidden','true');
const playerArtFrame=playerRoom.querySelector('.rr-artwork-frame');playerArtFrame.append(playerVideo);
let playerArtVisible=!('IntersectionObserver' in window),playerArtSource='',playerArtPending=false,playerArtAttempt=0,playerArtFailed=false;
function syncPlayerArt(){
 const source=animatedCovers[playerIndex()]||'';
 if(source!==playerArtSource){
  playerArtAttempt++;playerArtPending=false;playerArtFailed=false;playerVideo.pause();playerVideo.style.opacity='0';
  playerArtSource=source;
  if(source)playerVideo.src=source;else{playerVideo.removeAttribute('src');playerVideo.load();}
 }
 const active=!!source&&playerArtVisible&&!document.hidden&&!reducedCoverMotion.matches;
 if(!active){playerArtAttempt++;playerArtPending=false;playerArtFailed=false;playerVideo.pause();playerVideo.style.opacity='0';return;}
 if(playerArtPending||playerArtFailed||!playerVideo.paused)return;
 const attempt=++playerArtAttempt;playerArtPending=true;
 playerVideo.play().then(()=>{
  if(attempt!==playerArtAttempt)return;
  playerArtPending=false;playerVideo.style.opacity='1';
 }).catch(()=>{if(attempt===playerArtAttempt){playerArtPending=false;playerArtFailed=true;playerVideo.style.opacity='0';}});
}

document.addEventListener('visibilitychange',syncPlayerArt);
reducedCoverMotion.addEventListener('change',syncPlayerArt);

function syncPlayer(){
 syncCrateIcons();
 syncPlayerArt();
 const i=playerIndex(),parts=trackParts(i),playing=audioStarted&&!audio.paused&&!audio.ended;
 const image=playerRoom.querySelector('.rr-player-art'),src=buttons[i].querySelector('.rr-front img').src;
 if(image.src!==src){image.src=src;image.alt=names[i]+' album artwork';}
 playerRoom.querySelector('.rr-deck-title').textContent=parts.title;
 playerRoom.querySelector('.rr-deck-artist').textContent=parts.artist;
 playerRoom.querySelector('.rr-deck-kicker').textContent=playing?'NOW PLAYING':audioStarted?'ON PAUSE':'PRESS PLAY · '+String(i+1).padStart(2,'0');

 playlistButtons.forEach((b,n)=>{const active=trackIds[n]===i;b.setAttribute('aria-current',String(active));b.querySelector('.rr-song-number').innerHTML=active&&playing?roomIcon('music-note'):String(trackIds[n]+1).padStart(2,'0');b.disabled=coverMoving;});

 playerRoom.querySelector('.rr-rewind').disabled=coverMoving||!audioStarted;playerRoom.querySelector('.rr-forward').disabled=coverMoving||!audioStarted;
}
deckPlay.addEventListener('click',()=>{if(coverMoving)return;if(audioStarted)pauseAudio.click();else playRecord(playerIndex());});
function stepTrack(direction){if(coverMoving)return;const at=trackIds.indexOf(playerIndex());playRecord(trackIds[(at+direction+trackIds.length)%trackIds.length]);}
playerRoom.querySelector('.rr-track-prev').addEventListener('click',()=>stepTrack(-1));
playerRoom.querySelector('.rr-track-next').addEventListener('click',()=>stepTrack(1));
for(const [selector,delta] of [['.rr-rewind',-10],['.rr-forward',10]])playerRoom.querySelector(selector).addEventListener('click',()=>{if(audioStarted&&Number.isFinite(audio.duration)){audio.currentTime=Math.min(audio.duration,Math.max(0,audio.currentTime+delta));syncAudio();}});
audio.addEventListener('ended',()=>{if(!coverMoving)stepTrack(1);});
// Keep playlist busy state aligned with crate controls through every animation phase.
new MutationObserver(syncPlayer).observe(next,{attributes:true,attributeFilter:['disabled']});

function restore(s){
  if(coverMoving)return;
  const p=s?.privateContent;
  if([3,4,5].includes(p?.version)&&Number.isInteger(p.selected)&&p.selected>=-1&&p.selected<16){
    selected=p.selected;flipped=!!p.flipped;
    listening=Number.isInteger(p.listening)&&p.listening>=0&&p.listening<16?p.listening:-1;
    browseIndex=Number.isInteger(p.browseIndex)&&p.browseIndex>=-1&&p.browseIndex<16?p.browseIndex:(selected>=0?selected:listening);
    coverOpen=p.version===5&&!!p.coverOpen&&selected>=0&&selected!==listening;
  }
  render();
}
restore(window.openai?.widgetState);syncAudio();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState)});
})();

<script>
(async()=>{
 const page=document.documentElement,root=document.getElementById('rr-crate-preview'),screen=document.querySelector('.rr-loading-screen');
 root.inert=true;
 let timeout;
 try{
  const urls=new Set(['remix-assets/room-wall.svg','remix-assets/crate-front-composite.svg','remix-assets/crate-edge-mask.svg','remix-assets/crate-front-edge-mask.svg']);
  root.querySelectorAll('.rr-scene img,.rr-header img,svg image').forEach(el=>{
   const url=el.currentSrc||el.getAttribute('src')||el.getAttribute('href');
   if(url)urls.add(url);
  });
  const ready=Promise.all([...urls].map(url=>new Promise((resolve,reject)=>{
   const image=new Image();
   image.onload=()=>{if(image.decode)image.decode().then(resolve,reject);else resolve();};
   image.onerror=()=>reject(new Error('Crate image unavailable'));
   image.src=url;
  })));
  await Promise.race([ready,new Promise((_,reject)=>{timeout=setTimeout(()=>reject(new Error('Loading timed out')),15000);})]);
  clearTimeout(timeout);
  await new Promise(resolve=>{const fallback=setTimeout(resolve,120);requestAnimationFrame(()=>requestAnimationFrame(()=>{clearTimeout(fallback);resolve();}));});
  root.inert=false;page.classList.add('rr-revealing');
  setTimeout(()=>{page.classList.remove('rr-loading','rr-revealing');screen.remove();},300);
 }catch(error){
  clearTimeout(timeout);
  screen.querySelector('p').textContent='The crate couldn’t load. Please try again.';
  screen.querySelector('.rr-loading-pulse').hidden=true;
  screen.querySelector('button').hidden=false;
 }
})();
</script>
